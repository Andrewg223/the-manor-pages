<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>The Manor — Video Player</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0c0b; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const vid = (params.get('v') || '').replace(/[^a-zA-Z0-9_-]/g, '');
const start = parseInt(params.get('start') || '0', 10) || 0;
if (vid) {
  const f = document.createElement('iframe');
  let u = 'https://www.youtube.com/embed/' + encodeURIComponent(vid) + '?autoplay=1&rel=0&playsinline=1';
  if (start > 0) u += '&start=' + start;
  f.src = u;
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
  f.allowFullscreen = true;
  document.body.appendChild(f);
}
</script>
</body>
</html>
